<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Verde: Mural Interativo</title>
    <style>
        :root {
            --verde-escuro: #1b5e20;
            --verde-principal: #2e7d32;
            --verde-claro: #4caf50;
            --amarelo-principal: #fbc02d;
            --amarelo-suave: #fffde7;
            --cinza-fundo: #f4f6f4;
            --texto: #1a251a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--cinza-fundo); color: var(--texto); line-height: 1.6; }

        header {
            background: linear-gradient(135deg, var(--verde-escuro), var(--verde-principal));
            color: #ffffff; padding: 2rem 1rem; text-align: center;
            border-bottom: 6px solid var(--amarelo-principal);
        }

        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }

        /* Cartões e Formulários */
        .card {
            background: white; border-radius: 10px; padding: 1.5rem;
            margin-bottom: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--verde-principal);
        }

        .card h3 { color: var(--verde-escuro); margin-bottom: 1rem; }

        input, select, textarea, button {
            width: 100%; padding: 0.8rem; margin-top: 0.5rem; margin-bottom: 1rem;
            border: 1px solid #ccc; border-radius: 6px; font-size: 1rem;
        }

        button {
            background-color: var(--amarelo-principal); color: var(--verde-escuro);
            font-weight: bold; border: none; cursor: pointer; transition: 0.2s;
        }

        button:hover { background-color: #f9a825; }

        /* Status de Login */
        .user-info {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--amarelo-suave); padding: 1rem; border-radius: 8px;
            margin-bottom: 1.5rem; border: 1px solid var(--amarelo-principal);
        }

        .btn-logout { width: auto; margin: 0; padding: 0.4rem 1rem; background-color: #d32f2f; color: white; }

        /* Feed de Postagens */
        .post {
            background: white; border-radius: 8px; padding: 1rem;
            margin-bottom: 1rem; border: 1px solid #e0e0e0;
        }

        .post-header { display: flex; justify-content: space-between; font-size: 0.9rem; color: #555; }
        .post-author { font-weight: bold; color: var(--verde-escuro); }
        .post-tag { background: var(--amarelo-principal); padding: 0.2rem 0.6rem; border-radius: 12px; font-weight: bold; font-size: 0.8rem; }
        .post-content { margin-top: 0.8rem; font-size: 1rem; }

        .hidden { display: none; }
    </style>

    <!-- SDK do Firebase (Versão Modular via CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURAÇÃO DO SEU FIREBASE (Substitua pelos seus dados do console do Firebase)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Variáveis de Estado
        let usuarioAtual = null;

        // Elementos DOM
        const authSection = document.getElementById('auth-section');
        const appSection = document.getElementById('app-section');
        const userInfo = document.getElementById('user-info');
        const userEmailSpan = document.getElementById('user-email');
        const postsContainer = document.getElementById('posts-container');

        // Autenticação: Cadastro / Login
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert("Erro ao entrar: " + error.message);
            }
        });

        document.getElementById('btn-register').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert("Conta criada com sucesso!");
            } catch (error) {
                alert("Erro ao cadastrar: " + error.message);
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        // Monitorar Estado do Usuário
        onAuthStateChanged(auth, (user) => {
            if (user) {
                usuarioAtual = user;
                userEmailSpan.textContent = user.email;
                authSection.classList.add('hidden');
                appSection.classList.remove('hidden');
                carregarPostagens();
            } else {
                usuarioAtual = null;
                authSection.classList.remove('hidden');
                appSection.classList.add('hidden');
            }
        });

        // Enviar Postagem
        document.getElementById('form-post').addEventListener('submit', async (e) => {
            e.preventDefault();
            const turma = document.getElementById('turma-select').value;
            const desafio = document.getElementById('desafio-input').value;
            const mensagem = document.getElementById('mensagem-input').value;

            try {
                await addDoc(collection(db, "postagens"), {
                    autor: usuarioAtual.email,
                    turma: turma,
                    desafio: desafio,
                    mensagem: mensagem,
                    data: new Date()
                });
                document.getElementById('mensagem-input').value = '';
                document.getElementById('desafio-input').value = '';
                alert("Desafio publicado!");
            } catch (error) {
                alert("Erro ao publicar: " + error.message);
            }
        });

        // Carregar Postagens em Tempo Real
        function carregarPostagens() {
            const q = query(collection(db, "postagens"), orderBy("data", "desc"));
            onSnapshot(q, (snapshot) => {
                postsContainer.innerHTML = '';
                snapshot.forEach((doc) => {
                    const post = doc.data();
                    const postEl = document.createElement('div');
                    postEl.className = 'post';
                    postEl.innerHTML = `
                        <div class="post-header">
                            <span class="post-author">${post.autor} (${post.turma})</span>
                            <span class="post-tag">${post.desafio}</span>
                        </div>
                        <div class="post-content">${post.mensagem}</div>
                    `;
                    postsContainer.appendChild(postEl);
                });
            });
        }
    </script>
</head>
<body>

    <header>
        <h1>🌱 Desafio Verde: Mural da Escola</h1>
        <p>Compartilhe suas conquistas ambientais com a escola toda!</p>
    </header>

    <div class="container">

        <!-- Área de Login e Registro -->
        <div id="auth-section" class="card">
            <h3>🔑 Entrar / Criar Conta</h3>
            <input type="email" id="email" placeholder="Seu e-mail (ex: aluno@gmail.com)" required>
            <input type="password" id="password" placeholder="Sua senha" required>
            <button id="btn-login">Entrar</button>
            <button id="btn-register" style="background-color: var(--verde-claro); color: white;">Criar Nova Conta</button>
        </div>

        <!-- Área Principal (Visível apenas após login) -->
        <div id="app-section" class="hidden">
            
            <div class="user-info">
                <span>Conectado como: <strong id="user-email"></strong></span>
                <button id="btn-logout" class="btn-logout">Sair</button>
            </div>

            <!-- Form para Postar Novo Desafio -->
            <div class="card">
                <h3>📢 Registrar Desafio Concluído</h3>
                <form id="form-post">
                    <label>Sua Turma:</label>
                    <select id="turma-select" required>
                        <option value="6º Ano EF">6º Ano EF</option>
                        <option value="7º Ano EF">7º Ano EF</option>
                        <option value="8º Ano EF">8º Ano EF</option>
                        <option value="9º Ano EF">9º Ano EF</option>
                        <option value="1º Ano EM">1º Ano EM</option>
                        <option value="2º Ano EM">2º Ano EM</option>
                        <option value="3º Ano EM">3º Ano EM</option>
                    </select>

                    <input type="text" id="desafio-input" placeholder="Ex: Semana 1 - Guardião da Água" required>
                    <textarea id="mensagem-input" rows="3" placeholder="Conte como foi realizar esse desafio..." required></textarea>
                    
                    <button type="submit">Publicar para Todos Verem</button>
                </form>
            </div>

            <!-- Feed de Postagens -->
            <h2>🏆 Mural de Ações Cumpridas</h2>
            <div id="posts-container" style="margin-top: 1rem;">
                <!-- Postagens entram aqui via JS -->
            </div>

        </div>

    </div>

</body>
</html>
