<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardiões da Terra - Jogo Ecológico</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

        #game-container { position: relative; width: 800px; height: 600px; background: #1e293b; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: 100%; cursor: pointer; }

        /* UI Overlays */
        .hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; }
        .hud-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; }
        .hud-title { font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: bold; letter-spacing: 0.05em; }
        .hud-value { font-size: 20px; font-weight: bold; color: #38bdf8; }

        .modal { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 32px; z-index: 20; transition: opacity 0.3s ease; }
        .modal.hidden { opacity: 0; pointer-events: none; }
        .modal h1 { font-size: 32px; color: #4ade80; margin-bottom: 12px; }
        .modal h2 { font-size: 24px; color: #38bdf8; margin-bottom: 8px; }
        .modal p { color: #cbd5e1; max-width: 480px; margin-bottom: 24px; font-size: 15px; line-height: 1.5; }

        .btn { background: #22c55e; color: #052e16; border: none; padding: 12px 32px; font-size: 16px; font-weight: bold; border-radius: 9999px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 14px rgba(34,197,94,0.4); }
        .btn:hover { background: #4ade80; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(34,197,94,0.6); }

        .bins-overlay { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 10; }
        .bin-btn { padding: 10px 16px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.2); font-weight: bold; font-size: 13px; color: white; cursor: pointer; transition: transform 0.1s; }
        .bin-btn:active { transform: scale(0.95); }
        .bin-plastic { background: #ef4444; }
        .bin-paper { background: #3b82f6; }
        .bin-glass { background: #22c55e; }
        .bin-metal { background: #eab308; color: #422006; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- HUD Superior -->
        <div class="hud">
            <div class="hud-card">
                <span class="hud-title">Nível</span>
                <span id="hud-level" class="hud-value">1</span>
            </div>
            <div class="hud-card">
                <span class="hud-title">Objetivo</span>
                <span id="hud-target" class="hud-value">0 / 50</span>
            </div>
            <div class="hud-card">
                <span class="hud-title">Pontos Eco</span>
                <span id="hud-score" class="hud-value">0</span>
            </div>
        </div>

        <!-- Botoes Lixeiras Nivel 1 -->
        <div id="bins-ui" class="bins-overlay hidden">
            <button class="bin-btn bin-plastic" onclick="game.selectBin('plastic')">🔴 Plástico</button>
            <button class="bin-btn bin-paper" onclick="game.selectBin('paper')">🔵 Papel</button>
            <button class="bin-btn bin-glass" onclick="game.selectBin('glass')">🟢 Vidro</button>
            <button class="bin-btn bin-metal" onclick="game.selectBin('metal')">🟡 Metal</button>
        </div>

        <!-- Canvas -->
        <canvas id="canvas" width="800" height="600"></canvas>

        <!-- Modais de Transição -->
        <div id="start-modal" class="modal">
            <h1>🌍 Guardiões da Terra</h1>
            <p>Ajude a salvar o planeta completando 3 desafios ecológicos: Reciclagem Rápida, Energia Eólica e Reflorestamento Dinâmico!</p>
            <button class="btn" onclick="game.startLevel(1)">Iniciar Desafio</button>
        </div>

        <div id="level-modal" class="modal hidden">
            <h2 id="modal-title">Nível Concluído!</h2>
            <p id="modal-desc">Você fez um ótimo trabalho para a sustentabilidade!</p>
            <button id="modal-btn" class="btn" onclick="game.nextLevel()">Próximo Nível</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        class EcoGame {
            constructor() {
                this.level = 1;
                this.score = 0;
                this.target = 0;
                this.progress = 0;
                this.active = false;
                
                // Entidades do jogo
                this.items = [];
                this.particles = [];
                this.selectedTrash = null;
                this.turbines = [];
                this.windAngle = 0;
                this.co2Level = 0;

                this.bindEvents();
                this.loop();
            }

            startLevel(lvl) {
                this.level = lvl;
                this.progress = 0;
                this.items = [];
                this.particles = [];
                this.selectedTrash = null;
                document.getElementById('start-modal').classList.add('hidden');
                document.getElementById('level-modal').classList.add('hidden');

                const binsUI = document.getElementById('bins-ui');
                binsUI.classList.add('hidden');

                if (lvl === 1) {
                    this.target = 50;
                    binsUI.classList.remove('hidden');
                } else if (lvl === 2) {
                    this.target = 100;
                    this.windAngle = Math.PI / 4;
                    this.turbines = [
                        { x: 200, y: 350, angle: 0 },
                        { x: 400, y: 300, angle: Math.PI / 2 },
                        { x: 600, y: 380, angle: Math.PI }
                    ];
                } else if (lvl === 3) {
                    this.target = 15;
                    this.co2Level = 20;
                }

                this.updateHUD();
                this.active = true;
            }

            updateHUD() {
                document.getElementById('hud-level').innerText = this.level;
                document.getElementById('hud-score').innerText = this.score;
                document.getElementById('hud-target').innerText = `${Math.floor(this.progress)} / ${this.target}`;
            }

            bindEvents() {
                canvas.addEventListener('click', (e) => {
                    if (!this.active) return;
                    const rect = canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    if (this.level === 1) {
                        // Selecionar lixo caindo
                        for (let item of this.items) {
                            const dist = Math.hypot(item.x - x, item.y - y);
                            if (dist < 25) {
                                this.selectedTrash = item;
                                this.addParticles(x, y, '#38bdf8', 8);
                                break;
                            }
                        }
                    } else if (this.level === 2) {
                        // Girar Turbina
                        for (let t of this.turbines) {
                            const dist = Math.hypot(t.x - x, t.y - y);
                            if (dist < 40) {
                                t.angle += Math.PI / 4;
                                if (t.angle >= Math.PI * 2) t.angle = 0;
                                this.addParticles(t.x, t.y, '#38bdf8', 6);
                            }
                        }
                    } else if (this.level === 3) {
                        // Plantar Árvore
                        if (y > 250) {
                            this.items.push({ x, y, scale: 0 });
                            this.progress++;
                            this.score += 10;
                            this.co2Level = Math.max(0, this.co2Level - 5);
                            this.addParticles(x, y, '#22c55e', 12);
                            this.updateHUD();

                            if (this.progress >= this.target) this.completeLevel();
                        }
                    }
                });
            }

            selectBin(type) {
                if (!this.selectedTrash) return;
                if (this.selectedTrash.type === type) {
                    this.score += 10;
                    this.progress += 10;
                    this.addParticles(this.selectedTrash.x, this.selectedTrash.y, '#22c55e', 15);
                } else {
                    this.score = Math.max(0, this.score - 5);
                    this.addParticles(this.selectedTrash.x, this.selectedTrash.y, '#ef4444', 15);
                }
                this.items = this.items.filter(i => i !== this.selectedTrash);
                this.selectedTrash = null;
                this.updateHUD();

                if (this.progress >= this.target) this.completeLevel();
            }

            addParticles(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 6,
                        vy: (Math.random() - 0.5) * 6,
                        radius: Math.random() * 4 + 2,
                        color, alpha: 1
                    });
                }
            }

            completeLevel() {
                this.active = false;
                document.getElementById('bins-ui').classList.add('hidden');
                const modal = document.getElementById('level-modal');
                const title = document.getElementById('modal-title');
                const desc = document.getElementById('modal-desc');
                const btn = document.getElementById('modal-btn');

                if (this.level < 3) {
                    title.innerText = `Nível ${this.level} Concluído!`;
                    desc.innerText = "Excelente trabalho ecológico! Vamos para o próximo desafio.";
                    btn.innerText = "Iniciar Nível " + (this.level + 1);
                    btn.onclick = () => this.startLevel(this.level + 1);
                } else {
                    title.innerText = "🏆 Planeta Salvo!";
                    desc.innerText = `Parabéns! Você completou todos os desafios com ${this.score} Pontos Eco.`;
                    btn.innerText = "Jogar Novamente";
                    btn.onclick = () => this.startLevel(1);
                }
                modal.classList.remove('hidden');
            }

            gameOver() {
                this.active = false;
                document.getElementById('bins-ui').classList.add('hidden');
                const modal = document.getElementById('level-modal');
                document.getElementById('modal-title').innerText = "⚠️ Alerta Ambiental!";
                document.getElementById('modal-desc').innerText = "O nível de poluição ficou alto demais. Tente novamente!";
                const btn = document.getElementById('modal-btn');
                btn.innerText = "Tentar Novamente";
                btn.onclick = () => this.startLevel(this.level);
                modal.classList.remove('hidden');
            }

            update() {
                if (!this.active) return;

                // Atualizar Partículas
                this.particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
                });
                this.particles = this.particles.filter(p => p.alpha > 0);

                // Lógica Nível 1: Lixo caindo
                if (this.level === 1) {
                    if (Math.random() < 0.03) {
                        const types = ['plastic', 'paper', 'glass', 'metal'];
                        this.items.push({
                            x: Math.random() * 700 + 50,
                            y: -20,
                            type: types[Math.floor(Math.random() * types.length)],
                            speed: Math.random() * 1.5 + 1
                        });
                    }
                    this.items.forEach(item => item.y += item.speed);
                    this.items = this.items.filter(item => item.y < 620);
                }

                // Lógica Nível 2: Energia Eólica
                else if (this.level === 2) {
                    let aligned = 0;
                    this.turbines.forEach(t => {
                        let diff = Math.abs(t.angle - this.windAngle);
                        if (diff < 0.2) aligned++;
                    });
                    if (aligned > 0) {
                        this.progress = Math.min(this.target, this.progress + aligned * 0.08);
                        this.score += aligned * 0.02;
                        this.updateHUD();
                    }
                    if (this.progress >= this.target) this.completeLevel();
                }

                // Lógica Nível 3: CO2 e Árvores
                else if (this.level === 3) {
                    this.co2Level += 0.04;
                    if (this.co2Level >= 100) this.gameOver();

                    this.items.forEach(tree => {
                        if (tree.scale < 1) tree.scale += 0.02;
                    });
                }
            }

            draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Fundo dinâmico por Nível
                if (this.level === 1) {
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                } else if (this.level === 2) {
                    ctx.fillStyle = '#0284c7';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    // Vento
                    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        let y = 100 + i * 100;
                        ctx.moveTo(0, y);
                        ctx.lineTo(800, y + Math.tan(this.windAngle) * 200);
                    }
                    ctx.stroke();
                } else if (this.level === 3) {
                    // Céu e Solo poluídos vs limpos
                    let pollRatio = this.co2Level / 100;
                    ctx.fillStyle = `rgb(${70 + pollRatio * 50}, ${130 - pollRatio * 50}, ${180 - pollRatio * 100})`;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.fillStyle = '#15803d';
                    ctx.fillRect(0, 250, canvas.width, 350);

                    // Barra CO2
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.fillRect(200, 20, 400, 16);
                    ctx.fillStyle = pollRatio > 0.7 ? '#ef4444' : '#eab308';
                    ctx.fillRect(200, 20, 400 * pollRatio, 16);
                }

                // Desenhar Lixo (Nível 1)
                if (this.level === 1) {
                    this.items.forEach(item => {
                        ctx.beginPath();
                        ctx.arc(item.x, item.y, 16, 0, Math.PI * 2);
                        if (item.type === 'plastic') ctx.fillStyle = '#ef4444';
                        if (item.type === 'paper') ctx.fillStyle = '#3b82f6';
                        if (item.type === 'glass') ctx.fillStyle = '#22c55e';
                        if (item.type === 'metal') ctx.fillStyle = '#eab308';
                        ctx.fill();

                        if (this.selectedTrash === item) {
                            ctx.strokeStyle = '#ffffff';
                            ctx.lineWidth = 3;
                            ctx.stroke();
                        }
                    });
                }

                // Desenhar Turbinas (Nível 2)
                if (this.level === 2) {
                    this.turbines.forEach(t => {
                        ctx.fillStyle = '#f8fafc';
                        ctx.fillRect(t.x - 4, t.y, 8, 120);

                        ctx.save();
                        ctx.translate(t.x, t.y);
                        ctx.rotate(t.angle);
                        ctx.strokeStyle = '#f8fafc';
                        ctx.lineWidth = 6;
                        for (let i = 0; i < 3; i++) {
                            ctx.beginPath();
                            ctx.moveTo(0, 0);
                            ctx.lineTo(0, -45);
                            ctx.stroke();
                            ctx.rotate((Math.PI * 2) / 3);
                        }
                        ctx.restore();
                    });
                }

                // Desenhar Árvores (Nível 3)
                if (this.level === 3) {
                    this.items.forEach(tree => {
                        ctx.save();
                        ctx.translate(tree.x, tree.y);
                        ctx.scale(tree.scale, tree.scale);

                        ctx.fillStyle = '#78350f';
                        ctx.fillRect(-6, -10, 12, 20);

                        ctx.beginPath();
                        ctx.arc(0, -25, 20, 0, Math.PI * 2);
                        ctx.fillStyle = '#22c55e';
                        ctx.fill();

                        ctx.restore();
                    });
                }

                // Desenhar Partículas
                this.particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        const game = new EcoGame();
    </script>
</body>
</html>
